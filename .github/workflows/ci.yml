name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e '.[dev]'

      - name: Lint and type-check source
        run: |
          ruff check src tests
          mypy src/statetrace

      - name: Syntax check
        run: python -m compileall -q src examples/fixture_repo/src

      - name: Unit and integration tests
        run: python -m pytest -q tests

      - name: Run the packaged Replay demo from an isolated state directory
        shell: bash
        run: |
          demo_state=$(mktemp -d)
          demo_output=$(STATETRACE_HOME="$demo_state" statetrace demo)
          echo "$demo_output"
          python -c 'import json,sys; result=json.load(sys.stdin); assert result["status"] == "COMPLETED"; assert result["mode"] == "replay"' <<< "$demo_output"
          report_path=$(python -c 'import json,sys; print(json.load(sys.stdin)["report"])' <<< "$demo_output")
          test -s "$report_path"

      - name: Confirm the teaching fixture still exposes its intentional bug
        shell: bash
        run: |
          set +e
          fixture_output=$(cd examples/fixture_repo && python -m pytest -q 2>&1)
          fixture_status=$?
          set -e
          echo "$fixture_output"
          if [ "$fixture_status" -ne 1 ]; then
            echo "Expected the fixture test suite to report ordinary test failures (exit 1)."
            exit 1
          fi
          if [[ "$fixture_output" != *"3 failed, 1 passed"* ]]; then
            echo "Expected exactly the documented 3 failing and 1 passing fixture tests."
            exit 1
          fi

      - name: Build source and wheel distributions
        run: python -m build

      - name: Smoke-test the built wheel outside the checkout
        shell: bash
        run: |
          wheel_path=$(find dist -name '*.whl' -print -quit)
          wheel_env=$(mktemp -d)
          wheel_state=$(mktemp -d)
          python -m venv "$wheel_env/venv"
          "$wheel_env/venv/bin/python" -m pip install "${wheel_path}[demo]"
          demo_output=$(cd "$wheel_env" && STATETRACE_HOME="$wheel_state" "$wheel_env/venv/bin/statetrace" demo)
          echo "$demo_output"
          python -c 'import json,sys; result=json.load(sys.stdin); assert result["status"] == "COMPLETED"; assert result["mode"] == "replay"' <<< "$demo_output"
